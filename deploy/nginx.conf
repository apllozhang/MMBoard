# Symphony Console — nginx:alpine 静态托管 + /api/ 反代预留
# 引擎侧:Symphony HTTP Server(SPEC §13.7,默认绑定 loopback);
# 容器内经 host 网关访问宿主机引擎,端口随引擎 --port 调整(默认 8787)。
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 字体与静态资产长缓存(内容带 hash)
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location /fonts/  { expires 30d; add_header Cache-Control "public, immutable"; }

  # version.json 与页面短缓存(迭代即时生效)
  location = /design-system.version.json { expires 5m; add_header Cache-Control "public"; }

  # Symphony 引擎 API 反代(引擎就绪后启用;VITE_SYMPHONY_API 可置空走同源 /api/)
  # location /api/ {
  #   proxy_pass http://host.docker.internal:8787;
  #   proxy_set_header Host $host;
  #   proxy_read_timeout 75s;
  # }

  # hash 路由应用;兜底回 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
